name: Publish VS Code Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run compile --if-present
      - run: npm run lint:webview

      - name: Resolve tag and pre-release flag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG#v}
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--pre-release"
          else
            PRERELEASE=""
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm version ${{ steps.tag.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish to VS Code Marketplace
        run: |
          npx @vscode/vsce publish ${{ steps.tag.outputs.prerelease }} -p "${{ secrets.VSCE_PAT }}"

      - name: Summary
        if: always()
        run: |
          echo "## Publish summary" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${{ steps.tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Channel: ${{ steps.tag.outputs.prerelease == '--pre-release' && 'pre-release' || 'stable' }}" >> $GITHUB_STEP_SUMMARY
